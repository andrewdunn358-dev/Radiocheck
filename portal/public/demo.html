<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RadioCheck Demo</title>
<meta name="description" content="Interactive demo of the RadioCheck app for the UK Armed Forces community. Example conversations only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block">
<style>
/* Layout: presenter bar on top; device stage (phone or staff desktop) on the left, tour/presenter panel on the right; stacks on narrow screens */
:root {
  --bg: #eaeef3;
  --panel: #ffffff;
  --ink: #142030;
  --muted: #566577;
  --line: #d3dbe5;
  --navy: #1e3a5f;
  --navy-ink: #ffffff;
  --gold: #8a6f12;
  --gold-soft: #f6eccb;
  --chip: #e3e9f0;

  /* app (veteran + peer) — the real RadioCheck light theme, fixed in both page themes */
  --a-bg: #f5f7fa; --a-surface: #ffffff; --a-text: #1a2332; --a-text2: #4a5568; --a-muted: #6b7280;
  --a-primary: #3b82f6; --a-border: #e5e7eb; --a-danger: #dc2626;
  /* staff portal — the real portal's dark navy and gold, fixed */
  --s-bg: #0f172a; --s-card: #1e293b; --s-border: #334155; --s-primary: #1e3a5f; --s-gold: #c9a227; --s-text: #e2e8f0; --s-muted: #94a3b8;

  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --app: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b131e; --panel: #142133; --ink: #e6ecf3; --muted: #9babbe; --line: #263851;
    --navy: #2d5a87; --navy-ink: #ffffff; --gold: #d4b44a; --gold-soft: #2e2810; --chip: #1c2c42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b131e; --panel: #142133; --ink: #e6ecf3; --muted: #9babbe; --line: #263851;
  --navy: #2d5a87; --navy-ink: #ffffff; --gold: #d4b44a; --gold-soft: #2e2810; --chip: #1c2c42;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--a-primary); outline-offset: 2px; }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-feature-settings: "liga"; width: 1em; overflow: hidden; vertical-align: middle; flex: none; }

/* ---------- chrome ---------- */
.shell { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 32px; display: grid; gap: 14px; }
.topbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 40px; height: 40px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: .9rem; color: var(--muted); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.seg .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ghostbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: .88rem; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
@media (max-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.devwrap { display: grid; justify-items: center; gap: 8px; min-width: 0; }
#device { width: 100%; min-width: 0; display: flex; justify-content: center; }
.devlabel { font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .95rem; color: var(--muted); }

.phone { width: 380px; max-width: 100%; height: min(780px, calc(100vh - 150px)); min-height: 560px; background: #0a0d12; border-radius: 46px; padding: 11px; box-shadow: 0 18px 40px rgba(10,20,35,.28); position: relative; }
.phone .screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--a-bg); color: var(--a-text); font-family: var(--app); position: relative; display: flex; flex-direction: column; }
.sbar { display: flex; justify-content: space-between; padding: 12px 26px 6px; font-size: 13px; font-weight: 600; color: var(--a-text); flex: none; font-variant-numeric: tabular-nums; }
.desk { width: 100%; max-width: 980px; height: min(680px, calc(100vh - 150px)); min-height: 520px; background: #0a0d12; border-radius: 14px; padding: 10px 10px 14px; box-shadow: 0 18px 40px rgba(10,20,35,.28); }
.desk .screen { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; background: var(--s-bg); color: var(--s-text); font-family: var(--app); display: flex; }
@media (max-width: 700px) { .desk { height: auto; min-height: 0; } .desk .screen { flex-direction: column; height: auto; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 960px) { .panel { position: static; } }
.stepno { font-family: var(--display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-size: .9rem; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 2rem; line-height: 1.05; text-wrap: balance; }
.panel .say { font-size: 1.02rem; display: grid; gap: 10px; }
.panel .say p { margin: 0; }
.try { background: var(--gold-soft); border-radius: 10px; padding: 10px 12px; font-size: .92rem; display: flex; gap: 8px; align-items: flex-start; }
.try .ms { color: var(--gold); font-size: 20px; }
.navrow { display: flex; gap: 10px; }
.navrow button { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
.navrow .back { background: var(--chip); color: var(--ink); }
.navrow .next { background: var(--navy); color: var(--navy-ink); }
.navrow button:disabled { opacity: .4; cursor: default; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots button { width: 22px; height: 6px; border-radius: 3px; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.dots button[aria-current="true"] { background: var(--gold); }
.dots button.done { background: var(--navy); }
.jump { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jump button { text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 9px 10px; cursor: pointer; font-size: .88rem; display: flex; gap: 8px; align-items: center; color: var(--ink); }
.jump .ms { color: var(--navy); font-size: 20px; }
:root[data-theme="dark"] .jump .ms { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .jump .ms { color: var(--gold); } }
.fine { color: var(--muted); font-size: .82rem; margin: 0; }
.kbd { font-size: .78rem; color: var(--muted); }

/* ---------- veteran app ---------- */
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .scroll { scroll-behavior: auto; } }
.pad { padding: 4px 18px 28px; display: flex; flex-direction: column; gap: 14px; }
.backbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; font-weight: 600; font-size: 16px; color: var(--a-text); padding: 6px 0; cursor: pointer; align-self: flex-start; }
.hdr { text-align: center; display: grid; justify-items: center; gap: 4px; padding-top: 4px; position: relative; }
.hdr img { width: 112px; height: 112px; }
.hdr .t { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
.hdr .tag { color: var(--a-text2); font-size: 15px; }
.settings { position: absolute; right: 0; top: 0; color: var(--a-text2); }
.card { background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
.tapcard { cursor: pointer; text-align: left; width: 100%; }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.ttl { font-weight: 700; font-size: 16px; }
.sub { color: var(--a-text2); font-size: 14px; }
.muted { color: var(--a-muted); font-size: 13px; }
.voices { background: linear-gradient(135deg, #1e3a5f, #2d5a87); color: #fff; border: 0; border-radius: 18px; padding: 16px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; }
.voices .play { width: 48px; height: 48px; border-radius: 50%; background: #c9a227; color: #1a1300; display: grid; place-items: center; flex: none; }
.voices .play .ms { font-size: 30px; }
.voices .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.sechead { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 0; width: 100%; cursor: pointer; text-align: left; }
.sechead .h { font-size: 20px; font-weight: 800; }
.sechead .toggle { color: var(--a-primary); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; }
.platoon { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mem { background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 14px; padding: 10px 6px; display: grid; justify-items: center; gap: 4px; cursor: pointer; text-align: center; }
.mem img { width: 62px; height: 62px; border-radius: 50%; object-fit: cover; }
.mem .n { font-weight: 700; font-size: 14px; }
.mem .d { font-size: 11px; color: var(--a-text2); line-height: 1.25; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 16px; padding: 14px 12px; display: grid; gap: 8px; align-content: start; cursor: pointer; text-align: left; }
.tile .ic { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; }
.tile .ic .ms { font-size: 28px; }
.tile .t { font-weight: 700; font-size: 15px; line-height: 1.2; }
.tile .d { font-size: 12.5px; color: var(--a-text2); line-height: 1.3; }
.tile.primary { border: 2px solid var(--a-primary); }
.tile.next { border: 2px dashed #c9a227; background: #fffbea; }
.badge { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border-radius: 6px; padding: 2px 6px; background: #c9a227; color: #1a1300; justify-self: start; }
.banner { display: flex; align-items: center; gap: 12px; background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 16px; padding: 14px; cursor: pointer; text-align: left; width: 100%; }
.banner .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.disclaimer { background: #fef2f2; color: #991b1b; border-radius: 12px; padding: 12px; font-size: 13px; text-align: center; }
.stafflink { background: none; border: 0; color: var(--a-muted); display: inline-flex; gap: 6px; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
.feat { display: grid; gap: 8px; }
.feat div { display: flex; gap: 8px; font-size: 14px; align-items: flex-start; }
.quote { font-style: italic; color: var(--a-text2); font-size: 14px; }
.btn { border: 0; border-radius: 12px; padding: 13px 14px; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px; width: 100%; }
.btn.primary { background: var(--a-primary); color: #fff; }
.btn.green { background: #16a34a; color: #fff; }
.btn.red { background: var(--a-danger); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--a-border); color: var(--a-text); }
.btn.soft { background: #eef2f7; color: var(--a-text); }
.h1 { font-size: 26px; font-weight: 800; line-height: 1.15; margin: 0; }
.h2 { font-size: 18px; font-weight: 800; margin: 4px 0 0; }
.p { margin: 0; font-size: 15px; color: var(--a-text2); }
.callout { border-radius: 14px; padding: 14px; display: grid; gap: 6px; border-left: 4px solid; background: var(--a-surface); }
.svc { display: grid; gap: 6px; }
.svc .num { font-weight: 800; font-size: 17px; color: var(--a-primary); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.pill.ok { background: #dcfce7; color: #166534; }
.pill.lim { background: #fef3c7; color: #92400e; }
.pill.off { background: #f1f5f9; color: #64748b; }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
.initials { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; }
.field { display: grid; gap: 5px; font-size: 14px; font-weight: 600; color: var(--a-text); }
.field input, .field textarea, .field select { font: inherit; font-weight: 400; font-size: 15px; border: 1px solid var(--a-border); border-radius: 10px; padding: 10px 12px; background: #fff; color: var(--a-text); }
.choice { display: flex; gap: 6px; flex-wrap: wrap; }
.choice button { border: 1px solid var(--a-border); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; color: var(--a-text); }
.choice button[aria-pressed="true"] { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
.center { text-align: center; justify-items: center; }
.bigicon { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; }
.bigicon .ms { font-size: 42px; }
.spinner { width: 54px; height: 54px; border: 5px solid #dbeafe; border-top-color: var(--a-primary); border-radius: 50%; margin: 10px auto; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* modal */
.modal { position: absolute; inset: 0; background: rgba(15,23,42,.55); display: grid; place-items: center; padding: 18px; z-index: 5; }
.modal .box { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-height: 100%; overflow-y: auto; display: grid; gap: 10px; justify-items: center; text-align: center; }
.modal .box img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; }
.modal .bio { text-align: left; font-size: 14px; color: var(--a-text2); }

/* chat */
.chathead { display: flex; align-items: center; gap: 10px; padding: 6px 14px 10px; border-bottom: 1px solid var(--a-border); background: var(--a-surface); flex: none; }
.chathead .back { background: none; border: 0; cursor: pointer; color: var(--a-text); padding: 4px; }
.chathead .nm { font-weight: 800; font-size: 16px; }
.chathead .rl { font-size: 12px; color: var(--a-muted); }
.ai-tag { font-size: 10.5px; font-weight: 800; background: #eef2ff; color: #4338ca; border-radius: 6px; padding: 2px 6px; margin-left: 4px; }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 84%; padding: 10px 13px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
.msg.ai { background: var(--a-surface); border: 1px solid var(--a-border); border-bottom-left-radius: 6px; align-self: flex-start; }
.msg.me { background: var(--a-primary); color: #fff; border-bottom-right-radius: 6px; align-self: flex-end; }
.msg.sys { align-self: center; background: #fffbea; border: 1px dashed #c9a227; color: #6b5300; font-size: 12.5px; border-radius: 10px; max-width: 94%; text-align: center; }
.typing { align-self: flex-start; background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 18px; padding: 12px 14px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; animation: bob 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }
.safety { align-self: stretch; background: #fff; border: 2px solid var(--a-danger); border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
.safety .st { font-weight: 800; color: var(--a-danger); display: flex; gap: 6px; align-items: center; }
.safety .ln { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; border-top: 1px solid var(--a-border); padding-top: 6px; }
.safety .ln b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px 4px; flex: none; }
.chips button { border: 1.5px solid var(--a-primary); color: var(--a-primary); background: #fff; border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; }
.composer { display: flex; gap: 8px; padding: 8px 14px 14px; flex: none; }
.composer div { flex: 1; border: 1px solid var(--a-border); border-radius: 999px; padding: 10px 14px; color: var(--a-muted); font-size: 14px; background: #fff; }
.composer .send { width: 42px; height: 42px; border-radius: 50%; background: var(--a-primary); color: #fff; display: grid; place-items: center; }

/* self-care */
.breath { display: grid; place-items: center; height: 230px; }
.breath .sq { width: 140px; height: 140px; border-radius: 26px; background: #dbeafe; border: 3px solid var(--a-primary); display: grid; place-items: center; transition: transform 4s linear; font-weight: 800; color: #1e40af; font-size: 18px; }
@media (prefers-reduced-motion: reduce) { .breath .sq { transition: none; } }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.moods button { border: 1px solid var(--a-border); background: #fff; border-radius: 12px; padding: 8px 2px; display: grid; gap: 2px; justify-items: center; font-size: 11.5px; cursor: pointer; color: var(--a-text); }
.moods button .e { font-size: 26px; line-height: 1.1; }
.moods button[aria-pressed="true"] { border: 2px solid var(--a-primary); background: #eff6ff; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11px; color: var(--a-muted); }
.week .e { font-size: 20px; display: block; }
.step5 { font-size: 64px; font-weight: 900; color: var(--a-primary); line-height: 1; text-align: center; }

/* peer portal */
.ppbar { background: var(--s-primary); color: #fff; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; flex: none; }
.ppbar .t { font-weight: 800; font-size: 17px; }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg3 button { border: 1px solid var(--a-border); background: #fff; border-radius: 10px; padding: 9px 4px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--a-text); }
.seg3 button[aria-pressed="true"].a { background: #16a34a; border-color: #16a34a; color: #fff; }
.seg3 button[aria-pressed="true"].l { background: #f59e0b; border-color: #f59e0b; color: #fff; }
.seg3 button[aria-pressed="true"].u { background: #6b7280; border-color: #6b7280; color: #fff; }
.panic { background: var(--a-danger); color: #fff; border: 0; border-radius: 16px; padding: 16px; font-weight: 900; letter-spacing: .04em; font-size: 16px; cursor: pointer; display: flex; gap: 8px; justify-content: center; align-items: center; }

/* staff portal */
.side { width: 200px; background: #0b1222; border-right: 1px solid var(--s-border); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; flex: none; overflow-y: auto; }
.side .logo { display: flex; gap: 8px; align-items: center; padding: 0 6px 12px; font-weight: 800; color: #fff; }
.side .logo img { width: 30px; height: 30px; }
.side .logo small { display: block; color: var(--s-gold); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.side button { border: 0; background: transparent; color: var(--s-muted); text-align: left; padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 14px; }
.side button[aria-current="true"] { background: var(--s-primary); color: #fff; }
.side .cnt { margin-left: auto; background: #ef4444; color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px; }
@media (max-width: 700px) { .side { width: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--s-border); } .side .logo { width: 100%; } }
.smain { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 20px; display: grid; gap: 14px; align-content: start; }
.smain h3 { margin: 0; font-size: 20px; color: #fff; }
.stop { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.stop .who { color: var(--s-muted); font-size: 13px; }
.scard { background: var(--s-card); border: 1px solid var(--s-border); border-radius: 12px; padding: 14px; display: grid; gap: 8px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat .v { font-size: 30px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--s-muted); font-size: 13px; }
.alertrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--s-card); border: 1px solid var(--s-border); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; color: var(--s-text); width: 100%; }
.alertrow.sel { border-color: var(--s-gold); box-shadow: 0 0 0 1px var(--s-gold); }
.alertrow.new { border-left: 4px solid #ef4444; }
.risk { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; color: #fff; white-space: nowrap; }
.risk.critical { background: #ef4444; } .risk.high { background: #f97316; } .risk.medium { background: #eab308; color: #1a1300; } .risk.low { background: #22c55e; } .risk.panic { background: #dc2626; }
.status { font-size: 12px; color: var(--s-muted); white-space: nowrap; }
.status.active { color: #fca5a5; font-weight: 700; }
.status.ack { color: #fcd34d; font-weight: 700; }
.status.res { color: #86efac; font-weight: 700; }
.excerpt { font-size: 13.5px; color: var(--s-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--s-muted); } .kv dd { margin: 0; color: #fff; }
.convo { display: grid; gap: 6px; }
.convo div { font-size: 13.5px; padding: 8px 10px; border-radius: 8px; background: #0f172a; }
.convo b { color: var(--s-gold); font-size: 11.5px; display: block; text-transform: uppercase; letter-spacing: .05em; }
.sbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.sbtn { border: 1px solid var(--s-border); background: #0f172a; color: #fff; border-radius: 8px; padding: 9px 14px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.sbtn.gold { background: var(--s-gold); border-color: var(--s-gold); color: #1a1300; }
.sbtn:disabled { opacity: .45; cursor: default; }
.stable { width: 100%; border-collapse: collapse; font-size: 14px; }
.stable th { text-align: left; color: var(--s-muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--s-border); }
.stable td { padding: 9px 8px; border-bottom: 1px solid var(--s-border); }
.tablewrap { overflow-x: auto; }
.demo-note { font-size: 12px; color: var(--s-muted); }
.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90%; text-align: center; }
</style>
</head>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <img id="brandLogo" alt="" width="40" height="40">
      <div>
        <h1>RadioCheck</h1>
        <p>Interactive demo · example conversations, no real data</p>

    <div class="controls">
      <div class="seg" role="group" aria-label="Mode" id="modeSeg"></div>

      <button class="ghostbtn" id="resetBtn" type="button"><span class="ms">restart_alt</span>Reset demo</button>
    </div>
  </header>

  <main class="stage">
    <div class="devwrap">
      <div class="devlabel" id="devLabel"></div>
      <div id="device"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

  { t: 'Meet the AI Platoon', v: 'vet', say: ['Twenty AI companions, each with a service background and a specialism.', 'A veteran talks to someone who sounds like them, at 3am, when nobody else is up.'], tr: 'Tap Tommy to see his profile.', set: function () { home(); S.showPlatoon = true; }, after: function () { scrollToId('platoon'); } },
  { t: 'Honest about what AI is', v: 'vet', say: ['Before any AI chat, people are told plainly what it can and can\'t do.', 'It listens, supports and signposts. It doesn\'t diagnose, and it is not an emergency service.'], tr: 'Tap "I understand, start chatting".', set: function () { home(); S.stack.push({ s: 'consent', id: 'tommy' }); } },
  { t: 'An everyday conversation', v: 'vet', say: ['Most chats are ordinary: bad sleep, a rough week.', 'Tommy talks like a mate, gives practical tips, and can take them straight into a self-care tool.'], tr: 'Tap "Can\'t sleep again" and follow the replies.', set: function () { home(); openChat('tommy'); } },
  { t: 'Practical help', v: 'vet', say: ['Specialists handle the practical things that pile on the pressure: benefits, compensation, housing, legal trouble.', 'Here Penny explains PIP in plain English.'], tr: 'Tap "Can I claim PIP?"', set: function () { home(); openChat('penny'); } },
  { t: 'When it gets serious', v: 'vet', say: ['This is what RadioCheck is built around. A safety layer watches every conversation for signs of risk.', 'When someone is at risk, the AI asks them directly, stays with them, and puts real help in front of them: 999, NHS 111, Samaritans, a callback or a peer supporter.'], tr: 'Tap "Honestly? Not good" and follow it through.', set: function () { home(); openChat('tommy'); } },
  { t: 'Behind the scenes', v: 'staff', say: ['At the same moment, the duty team gets a safeguarding alert.', 'It shows the risk level, the message that triggered it and the recent conversation, so a trained person can step in.'], tr: 'Click the alert, then Acknowledge.', set: function () { raiseAlert(); S.staffTab = 'alerts'; S.selAlert = 'crisis'; } },
  { t: 'Real people, not just AI', v: 'vet', say: ['Veterans can talk to trained peer supporters: fellow veterans who have done the training.', 'They can call through the app, chat, or ask for a callback. No phone numbers are shared.'], tr: 'Tap Call or Chat next to Steve.', set: function () { home(); S.stack.push({ s: 'peer' }); } },
  { t: 'A callback when it suits', v: 'vet', say: ['Not everyone wants to talk there and then.', 'They pick who calls (a peer supporter or a counsellor) and when.'], tr: 'Tap "Request callback".', set: function () { home(); S.cbForm.sent = false; S.stack.push({ s: 'callback' }); } },
  { t: 'The peer supporter\'s side', v: 'peer', say: ['Volunteers have their own portal. They set when they\'re available and pick up callbacks.', 'If a call gets beyond them, one button brings in a counsellor.'], tr: 'Tap "Take This Callback", then try "NEED COUNSELLOR HELP".', set: function () { S.panicAsk = false; } },
  { t: 'Help that\'s always listed', v: 'vet', say: ['One tap from home: the 24/7 crisis lines that matter, from NHS 111 to Combat Stress.', 'And Tommy is right there at the top if they just want to talk.'], tr: 'Scroll through the helplines.', set: function () { home(); S.stack.push({ s: 'crisis' }); } },
  { t: 'Self-care between conversations', v: 'vet', say: ['Daily mood check-in, journal, breathing and grounding exercises, and the NHS PHQ-9 and GAD-7 questionnaires.', 'Plus Buddy Finder, to meet veterans nearby.'], tr: 'Try Breathing Exercises or Daily Check-in.', set: function () { home(); S.stack.push({ s: 'selfcare' }); } },
  { t: 'For the whole community', v: 'vet', say: ['Families serve too. Partners, parents, carers and forces kids each have their own area and their own companion.', "Here's He Served, on men's health and suicide prevention."], tr: 'Tap Back and open any other tile.', set: function () { home(); S.stack.push({ s: 'topic', id: 'he' }); } },
  { t: 'Coming next: Rear Link', v: 'vet', say: ['Veterans name up to three people they trust. One tap, "Send a flare", asks them to call.', 'It can ring through silent mode at 3am. It\'s designed, but it won\'t be built until the safety work is signed off.'], tr: 'Tap "Send a flare".', set: function () { home(); S.flare = 0; S.stack.push({ s: 'rearlink' }); } },
  { t: 'Where we are', v: 'vet', say: ['Built: the veteran app, the staff and peer supporter portals, and the safety layer.', 'Now: the safety layer is going through independent testing with Zentrafuge before launch. Next: a pilot, the Android and iPhone apps, and Rear Link.'], tr: 'Switch to Free play to explore anything again.', set: function () { home(); } }
];
function scrollToId(id) { setTimeout(function () { var el = document.getElementById(id), sc = document.getElementById('appScroll'); if (el && sc) sc.scrollTop = el.offsetTop - 10; }, 30); }
function openChat(id) {
  if (!S.consented) S.consented = true;
  S.stack.push({ s: 'chat', id: id }); startChat(id);
}
function gotoStep(i) {
  stopBreath(); S.chat = null; S.busy = false; S.modal = null; S.peerChat = null; S.peerFlow = null;
  S.step = Math.max(0, Math.min(TOUR.length - 1, i));
  var st = TOUR[S.step];
  S.view = st.v;
  st.set();
  render();
  if (st.after) st.after();
}
function renderPanel() {
  var el = document.getElementById('panel');
  if (S.mode === 'tour') {
    var st = TOUR[S.step];
    el.innerHTML = '<div class="stepno">Step ' + (S.step + 1) + ' of ' + TOUR.length + '</div><h2>' + esc(st.t) + '</h2><div class="say">' + st.say.map(function (s) { return '<p>' + esc(s) + '</p>'; }).join('') + '</div>' +
      '<div class="try">' + ic('touch_app') + '<span><b>Try:</b> ' + esc(st.tr) + '</span></div>' +
      '<div class="navrow"><button class="back" data-p="prev" ' + (S.step === 0 ? 'disabled' : '') + '>' + ic('arrow_back') + 'Back</button><button class="next" data-p="next" ' + (S.step === TOUR.length - 1 ? 'disabled' : '') + '>Next' + ic('arrow_forward') + '</button></div>' +
      '<div class="dots">' + TOUR.map(function (s, i) { return '<button data-p="dot" data-i="' + i + '" aria-label="Step ' + (i + 1) + ': ' + esc(s.t) + '" ' + (i === S.step ? 'aria-current="true"' : '') + ' class="' + (i < S.step ? 'done' : '') + '"></button>'; }).join('') + '</div>' +
      '<p class="kbd">Arrow keys move between steps.</p>';
  } else {
    var J = [['home', 'Home screen', 'home'], ['platoon', 'AI Platoon', 'groups'], ['tommy', 'Chat with Tommy', 'forum'], ['penny', 'Chat with Penny', 'payments'], ['peer', 'Peer support', 'diversity_3'], ['callback', 'Request a callback', 'call'], ['crisis', 'Crisis helplines', 'sos'], ['selfcare', 'Self-care tools', 'self_improvement'], ['rearlink', 'Rear Link (next)', 'flare'], ['peerportal', 'Peer supporter portal', 'badge'], ['staff', 'Staff portal', 'shield_person']];
    el.innerHTML = '<div class="stepno">Free play</div><h2>Explore the app</h2><div class="say"><p>Tap around the phone, or jump straight to an area.</p></div><div class="jump">' + J.map(function (j) { return '<button data-p="jump" data-v="' + j[0] + '">' + ic(j[2]) + j[1] + '</button>'; }).join('') + '</div>' +
      '<p class="fine">Tip: for the crisis conversation, chat with Tommy and tap "Honestly? Not good". The alert then shows in the staff portal.</p>';
  }
  el.innerHTML += '<p class="fine">Demo only. Example names and scripted conversations. Nothing here is sent anywhere.</p>';
}

/* ================= render ================= */
function render() {
  var labels = { vet: "Veteran's app", peer: 'Peer supporter portal', staff: 'Staff portal' };
  document.getElementById('devLabel').textContent = labels[S.view];
  var dev = document.getElementById('device');
  var keepScroll = null, sc = dev.querySelector('.scroll, .smain');
  if (sc) keepScroll = sc.scrollTop;
  var prevKey = dev.getAttribute('data-key');
  var key = S.view + '|' + (S.view === 'vet' ? S.stack.length + cur().s : S.staffTab);
  dev.innerHTML = S.view === 'vet' ? renderVet() : S.view === 'peer' ? renderPeer() : renderStaff();
  dev.setAttribute('data-key', key);
  var sc2 = dev.querySelector('.scroll, .smain');
  if (sc2 && keepScroll !== null && prevKey === key) sc2.scrollTop = keepScroll;
  var open = S.alerts.some(function (a) { return a.fresh && a.status === 'active'; });
  document.getElementById('modeSeg').innerHTML = '<button data-m="tour" aria-pressed="' + (S.mode === 'tour') + '">' + ic('slideshow', 'font-size:18px') + 'Guided tour</button><button data-m="free" aria-pressed="' + (S.mode === 'free') + '">' + ic('touch_app', 'font-size:18px') + 'Free play</button>';
  document.getElementById('viewSeg').innerHTML = '<button data-w="vet" aria-pressed="' + (S.view === 'vet') + '">Veteran</button><button data-w="peer" aria-pressed="' + (S.view === 'peer') + '">Peer supporter</button><button data-w="staff" aria-pressed="' + (S.view === 'staff') + '">Staff' + (open ? ' <span class="dot" aria-label="new alert"></span>' : '') + '</button>';
  renderPanel();
}

/* ================= actions ================= */
var A = {
  back: back,
  home: function () { home(); render(); scrollTop(); },
  go: function (el) { var to = el.getAttribute('data-to'); if (to.indexOf('info:') === 0) go('info', { title: to.slice(5) }); else { if (to === 'callback') S.cbForm.sent = false; if (to === 'rearlink') S.flare = 0; go(to); } },
  toggleAbout: function () { S.showAbout = !S.showAbout; render(); },
  togglePlatoon: function () { S.showPlatoon = !S.showPlatoon; render(); },
  voices: function () { toast('Audio stories play here in the full app'); },
  staff: function () { S.view = 'staff'; S.staffTab = 'dashboard'; render(); },
  bio: function (el) { S.modal = el.getAttribute('data-id'); render(); },
  closeModal: function () { S.modal = null; render(); },
  chat: function (el) {
    var id = el.getAttribute('data-id'); S.modal = null;
    if (!S.consented) { go('consent', { id: id }); return; }
    S.stack.push({ s: 'chat', id: id }); startChat(id);
  },
  consent: function (el) { var id = el.getAttribute('data-id'); S.consented = true; S.stack.pop(); S.stack.push({ s: 'chat', id: id }); startChat(id); },
  chip: function (el) {
    if (S.busy) return;
    var nx = el.getAttribute('data-next'), lb = el.getAttribute('data-label');
    if (nx.indexOf('go:') === 0) { S.chat.msgs.push({ t: 'me', x: lb }); var to = nx.slice(3); if (to === 'callback') S.cbForm.sent = false; go(to); return; }
    playNode(nx, lb);
  },
  tile: function (el) {
    var id = el.getAttribute('data-id');
    if (id === 'crisis') go('crisis'); else if (id === 'peer') go('peer'); else if (id === 'selfcare') go('selfcare'); else go('topic', { id: id });
  },
  peerCall: function (el) {
    var i = +el.getAttribute('data-i'); S.peerFlow = 'finding'; go('peerCall', { i: i });
    setTimeout(function () { if (cur().s === 'peerCall') { S.peerFlow = 'done'; render(); } }, RM ? 400 : 1800);
  },
  peerChat: function (el) {
    var i = +el.getAttribute('data-i'); S.peerChat = { i: 0, msgs: [] }; go('peerChat', { i: i }); peerSay();
  },
  peerReply: function (el) { if (S.busy) return; var c = S.peerChat; c.msgs.push({ t: 'me', x: el.getAttribute('data-label') }); c.i++; peerSay(); },
  cbOpt: function (el) { S.cbForm[el.getAttribute('data-k')] = el.getAttribute('data-v'); render(); },
  cbSend: function () {
    var nm = (document.getElementById('cbName') || {}).value || 'Anon.';
    var note = (document.getElementById('cbNote') || {}).value || '';
    S.cbForm.sent = true;
    S.callbacks.unshift({ id: 'cb' + Date.now(), name: nm || 'Anon.', when: S.cbForm.when, type: S.cbForm.who, status: 'pending', note: note, fresh: true });
    render(); scrollTop();
  },
  mood: function (el) { S.mood = +el.getAttribute('data-i'); S.moodSaved = false; render(); },
  moodSave: function () { S.moodSaved = true; render(); },
  breathStart: function () {
    S.breathOn = true; S.breathPhase = 0; render();
    breathTimer = setInterval(function () { S.breathPhase = (S.breathPhase + 1) % 4; if (cur().s === 'breathing') render(); else stopBreath(); }, 4000);
  },
  breathStop: function () { stopBreath(); render(); },
  groundNext: function () { S.ground = Math.min(4, S.ground + 1); render(); },
  groundReset: function () { S.ground = 0; render(); },
  journalSave: function () { S.journalSaved = true; render(); },
  phq: function (el) { S.phq = +el.getAttribute('data-i'); render(); },
  bfMsg: function () { S.bfMsg = true; render(); },
  flare: function () { S.flare = 1; render(); },
  flareCancel: function () { S.flare = 0; render(); },
  flareSend: function () { S.flare = 2; render(); setTimeout(function () { if (S.flare === 2) { S.flare = 3; render(); } }, RM ? 500 : 2600); },
  flareReset: function () { S.flare = 0; render(); },
  pst: function (el) { S.peerStatus = el.getAttribute('data-v'); SUPPORTERS[0].st = S.peerStatus; render(); },
  cbTake: function (el) { setCb(el.getAttribute('data-id'), 'taken'); toast('Callback is yours. The veteran is told who will ring.'); },
  cbDone: function (el) { setCb(el.getAttribute('data-id'), 'done'); toast('Marked complete'); },
  cbRelease: function (el) { setCb(el.getAttribute('data-id'), 'pending'); toast('Released back to the queue'); },
  panicAsk: function () { S.panicAsk = true; render(); },
  panicCancel: function () { S.panicAsk = false; render(); },
  panicSend: function () {
    S.panicAsk = 'sent';
    S.alerts.unshift({ id: 'p' + Date.now(), type: 'panic', risk: 'panic', who: 'Steve (peer supporter)', time: 'Today ' + now(), trigger: 'Peer supporter needs counsellor help on a live call.', status: 'active', fresh: true });
    render();
  },
  stab: function (el) { S.staffTab = el.getAttribute('data-v'); render(); },
  salert: function (el) { S.selAlert = el.getAttribute('data-id'); render(); },
  sack: function () { setAlert('ack'); toast('Acknowledged. The team can see you\'ve got it.'); },
  sres: function () { setAlert('res'); toast('Resolved and logged for review'); },
  scall: function () { toast('Staff ring the veteran back from here (demo)'); },
  stoast: function (el) { toast(el.getAttribute('data-t')); }
};
function setCb(id, st) { S.callbacks.forEach(function (c) { if (c.id === id) { c.status = st; c.fresh = false; } }); }
function setAlert(st) { S.alerts.forEach(function (a) { if (a.id === S.selAlert) { a.status = st; } }); }

document.addEventListener('click', function (e) {
  var t = e.target;
  var m = t.closest('[data-m]');
  if (m) { S.mode = m.getAttribute('data-m'); if (S.mode === 'tour') gotoStep(S.step); else render(); return; }
  var w = t.closest('[data-w]');
  if (w) { S.view = w.getAttribute('data-w'); if (S.view === 'staff' && S.alerts.some(function (a) { return a.fresh && a.status === 'active'; })) S.staffTab = 'alerts'; render(); return; }
  var p = t.closest('[data-p]');
  if (p) {
    var k = p.getAttribute('data-p');
    if (k === 'next') gotoStep(S.step + 1);
    else if (k === 'prev') gotoStep(S.step - 1);
    else if (k === 'dot') gotoStep(+p.getAttribute('data-i'));
    else if (k === 'jump') jump(p.getAttribute('data-v'));
    return;
  }
  if (t.closest('[data-stop]') && !t.closest('[data-a]')) return;
  var a = t.closest('[data-a]');
  if (a && A[a.getAttribute('data-a')]) {
    if (a.classList.contains('modal') && t !== a) return;
    A[a.getAttribute('data-a')](a);
  }
});
function jump(v) {
  stopBreath(); S.chat = null; S.busy = false; S.modal = null;
  if (v === 'staff') { S.view = 'staff'; S.staffTab = S.alerts.some(function (a) { return a.fresh && a.status === 'active'; }) ? 'alerts' : 'dashboard'; render(); return; }
  if (v === 'peerportal') { S.view = 'peer'; render(); return; }
  S.view = 'vet'; home();
  if (v === 'platoon') { S.showPlatoon = true; render(); scrollToId('platoon'); return; }
  if (v === 'tommy' || v === 'penny') { openChat(v); render(); return; }
  if (v === 'callback') S.cbForm.sent = false;
  if (v === 'rearlink') S.flare = 0;
  if (v !== 'home') S.stack.push({ s: v });
  render(); scrollTop();
}
document.addEventListener('keydown', function (e) {
  if (S.mode !== 'tour') return;
  var tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { gotoStep(S.step + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { gotoStep(S.step - 1); e.preventDefault(); }
});
document.getElementById('resetBtn').addEventListener('click', function () {
  stopBreath(); var mode = S.mode; S = freshState(); S.mode = mode; SUPPORTERS[0].st = 'ok';
  if (mode === 'tour') gotoStep(0); else render();
});

gotoStep(0);
})();
</script>

</body>
</html>

name: Safety Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend_test.py'
      - 'portal/src/lib/staffPanic.ts'
      - 'portal/src/app/staff/page.tsx'
      - 'portal/src/lib/api.ts'
      - 'portal/src/components/staff/tabs/AlertsTab.tsx'
      - 'portal/tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend_test.py'
      - 'portal/src/lib/staffPanic.ts'
      - 'portal/src/app/staff/page.tsx'
      - 'portal/src/lib/api.ts'
      - 'portal/src/components/staff/tabs/AlertsTab.tsx'
      - 'portal/tests/**'

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Node >= 22.6 strips TypeScript types natively. Needed by the portal panic
      # tests and by backend/tests/test_staff_panic_alert_contract.py, which runs
      # portal/src/lib/staffPanic.ts to build the exact request the portal sends.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Portal panic-button tests
        run: node --test portal/tests/staffPanic.test.mjs portal/tests/alertsTabPanic.test.mjs

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          # mongomock-motor backs tests/test_validation_target_integrity.py, which
          # drives the real /api/ai-buddies/chat handler in-process. Without it that
          # file importorskips and the Validation Target Integrity regressions would
          # silently not run.
          pip install mongomock-motor

      - name: Run safety tests
        run: |
          cd backend
          pip install pytest pytest-asyncio
          python -m pytest \
            tests/test_round9_items3_4_5_signals_judge.py \
            tests/test_typographic_safety.py \
            tests/test_negation_word_boundary.py \
            tests/test_suppressor_explicit_current_turn.py \
            tests/test_fallback_validation.py \
            tests/test_validation_target_integrity.py \
            tests/test_terminal_path_reconstruction.py \
            tests/test_data_retention_router_access_control.py \
            tests/test_shift_reminders_route_access_control.py \
            tests/test_exit_a_persistence_containment.py \
            tests/test_safeguarding_router_access_control.py \
            tests/test_staff_panic_alert_contract.py \
            tests/test_privacy_protocol_wording.py \
            tests/test_validator_authority_alignment.py \
            -v
        env:
          SKIP_LIVE_TESTS: "true"
          MONGO_URL: "mongodb://localhost:27017/ci_dummy"
          OPENAI_API_KEY: "sk-ci-dummy"
